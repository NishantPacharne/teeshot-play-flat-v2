<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TeeShot · Play · Soft Fairway flat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* TeeShot Play — Soft Fairway flat color · A-mist solid #EFF5F1 · A3-mint-original nav · whole-row select */

:root{
  --green:#0B6B2F; --green-2:#13843F; --green-deep:#0A6129; --logo-green:#006830;
  --mint:#E3EFE0; --mint-line:#D3E2CF; --mint-ink:#CDE6D3; --mint-soft:#E8F1EB;
  --fairway:#F5F8F6; --fairway-2:#EEF4F0; --fairway-3:#F1F6EF;
  --page:#EFF5F1; --page-2:#EFF5F1;
  --surface:#FFFFFF; --surface-solid:#FFFFFF; --sel-bg:#FAFDF9;
  --ink:#102017; --muted:#4A5A4F;
  --yellow:#FFE14D; --yellow-ink:#1A1600;
  --r:14px;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{margin:0;background:#EFF5F1}
html,body{margin:0}
body{
  font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:#EFF5F1;
  min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* No photo / texture — solid Soft Fairway field only */
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.98);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);padding-top:env(safe-area-inset-top,0px)}
.top-row{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-row img{height:26px;width:auto;display:block}
.hdr-clean .top{border-top:4px solid var(--green);border-bottom:1px solid rgba(211,226,207,.85)}
.menu{width:44px;height:44px;border-radius:var(--r);background:var(--mint);color:var(--green);display:flex;align-items:center;justify-content:center}

main{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 280px max(12px,env(safe-area-inset-left,0px));background:transparent}

.course{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px;border-radius:var(--r);background:var(--surface);border:1.5px solid rgba(211,226,207,.95);box-shadow:0 2px 12px rgba(16,32,23,.06)}
.badge{position:relative;width:38px;height:38px;border-radius:var(--r);background:var(--green);overflow:hidden;flex-shrink:0}
.badge::before{content:"";position:absolute;left:-6px;right:-6px;bottom:-10px;height:22px;border-radius:50%;background:#2E9A55}
.badge svg{position:absolute;left:12px;top:6px}
.course .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.course .line{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow span{color:var(--green)}
.soft{height:40px;padding:0 12px;border-radius:var(--r);background:transparent;color:var(--green);font-size:15px;font-weight:700;flex-shrink:0;border:1.5px solid rgba(11,107,47,.22)}

.intro{display:flex;flex-direction:column;gap:2px;padding:4px 2px 2px}
.intro .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.intro h1{margin:0;font-size:22px;line-height:1.2}
.intro p{margin:0;font-size:15px;color:var(--muted)}
.steps{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--green);white-space:nowrap}
.steps i{width:18px;height:6px;border-radius:3px;background:rgba(201,220,197,.85)}.steps i.on{background:var(--green)}

/* Cards — Soft Fairway mist on flat field; whole-row select */
.card{
  position:relative;display:flex;flex-direction:column;gap:2px;width:100%;
  padding:10px 12px 10px 14px;border-radius:var(--r);
  background:var(--surface);border:1.5px solid rgba(211,226,207,.95);
  text-align:left;box-shadow:0 2px 12px rgba(16,32,23,.05);
  transition:border-color .22s ease,background-color .22s ease,box-shadow .22s ease,transform .15s ease;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:0;
  background:var(--green);border-radius:var(--r) 0 0 var(--r);
  transition:width .2s ease;
}
.card.on{
  border-color:var(--green);background:var(--sel-bg);
  box-shadow:0 6px 18px rgba(11,107,47,.14);
  padding-left:16px;
}
.card.on::before{width:4px}
button.card:active,.hio-head:active{transform:scale(.985)}

.head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.name{display:flex;align-items:center;gap:10px;min-width:0}
.name b{font-size:18px;white-space:nowrap}
.name small{font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.tile{
  width:36px;height:36px;border-radius:var(--r);
  background:var(--mint);color:var(--green);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background-color .22s ease,color .22s ease,box-shadow .22s ease;
  position:relative;
}
.card.on .tile{background:var(--green);color:var(--yellow);box-shadow:0 2px 6px rgba(11,107,47,.25)}
.chk{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  border:2px solid #C7D3CB;background:transparent;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.chk svg{display:none;color:#fff}
.card.on .chk{
  background:var(--green);border-color:var(--green);
  box-shadow:0 2px 6px rgba(11,107,47,.22);
}
.card.on .chk svg{display:block}

.hio .tile{position:relative;background:var(--mint)!important;color:inherit}
.hio.on .tile{background:var(--green)!important}
.hio .tile::before{content:"";position:absolute;left:7px;bottom:7px;width:22px;height:8px;border-radius:50%;background:var(--green)}
.hio.on .tile::before{background:rgba(255,225,77,.85)}
.hio .tile svg{position:absolute;left:13px;top:5px}
.hio-title{font-family:var(--display);font-size:22px;line-height:1.1;letter-spacing:.01em}
.desc{font-size:15px;color:var(--muted)}.desc b{color:var(--green)}

.hio-head{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;transition:transform .15s ease}
.hio-open{display:flex;flex-direction:column;gap:6px;margin-top:8px;animation:open .3s ease-out}
.pair{display:flex;gap:8px}
.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px;border-radius:var(--r);background:var(--mint)}
.stepper button{width:44px;height:48px;border-radius:var(--r);background:#fff;color:var(--green);font-size:24px;font-weight:700;transition:transform .12s ease}
.stepper button:active{transform:scale(.94)}
.stepper button:disabled{opacity:.4}
.amt{display:flex;flex-direction:column;align-items:center}
.amt small{font-size:13px;font-weight:600;color:var(--muted)}
.amt b,.ace b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.ace{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;border-radius:var(--r);background:repeating-linear-gradient(135deg,var(--green) 0 14px,var(--green-deep) 14px 28px);color:#fff}
.ace::before{content:"";position:absolute;right:-14px;top:-14px;width:46px;height:46px;border-radius:50%;border:6px solid rgba(255,225,77,.22)}
.ace::after{content:"";position:absolute;left:8px;bottom:6px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.ace small{position:relative;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--mint-ink)}
.ace b{position:relative;font-size:26px;color:var(--yellow)}
.slide{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
.slide input{flex:1;height:36px;margin:0;accent-color:var(--green)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20}
.bottom-in{max-width:480px;margin:0 auto;background:var(--surface);border-radius:var(--r) var(--r) 0 0;box-shadow:0 -6px 18px rgba(16,32,23,.08);border-top:1px solid var(--mint-line);overflow:hidden}
.dock{display:flex;align-items:center;gap:12px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sum{flex:1;min-width:0;display:flex;flex-direction:column}
.sum small{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .tot{display:flex;align-items:center;gap:8px}
.sum .tot b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.chips{display:flex}
.chips span{width:24px;height:24px;margin-left:-4px;border-radius:50%;background:var(--green);border:2px solid #fff;color:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
.chips span:first-child{margin-left:0}
.cta{display:flex;align-items:center;gap:8px;height:54px;padding:0 20px;border-radius:var(--r);background:var(--yellow);color:var(--yellow-ink);font-size:18px;font-weight:700;flex-shrink:0;transition:transform .12s ease,background-color .2s ease}
.cta:active{transform:scale(.96)}
.cta:disabled{background:var(--mint);color:var(--muted);padding:0 18px;font-size:16px}
.cta:disabled svg{display:none}

.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;width:max-content;max-width:90vw;padding:12px 16px;border-radius:var(--r);background:var(--ink);color:#fff;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
[hidden]{display:none!important}
@keyframes pop{from{transform:scale(.8);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Bottom nav — exact from teeshot-play-A3-mint-original.html */
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--mint)}
nav a{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:var(--r);color:#34463A;font-size:15px;font-weight:600;transition:background-color .2s ease,color .2s ease;text-decoration:none}
nav a.cur{background:var(--surface);color:var(--green);font-weight:700;box-shadow:0 2px 8px rgba(11,107,47,.18)}
nav a.off{opacity:.38;pointer-events:none;cursor:default}


/* Course Change sheet — Soft Fairway */
.sheet-backdrop{position:fixed;inset:0;z-index:50;background:rgba(16,32,23,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(16,32,23,.22);padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:min(72vh,560px);display:flex;flex-direction:column;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet-handle{width:40px;height:4px;border-radius:999px;background:#D3E2CF;margin:6px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:20px;font-weight:700;color:var(--ink)}
.sheet-close{height:40px;padding:0 14px;border-radius:12px;background:var(--mint);color:var(--green);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:700}
.sheet-list{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.course-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;border-radius:16px;border:1.5px solid rgba(211,226,207,.95);background:#FAFDF9;transition:border-color .15s,background .15s,box-shadow .15s}
.course-opt:active{transform:scale(.985)}
.course-opt.on{border-color:var(--green);background:#F0F9F2;box-shadow:inset 3px 0 0 var(--green)}
.course-opt .co-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.course-opt .co-txt b{font-size:16px;font-weight:700;color:var(--ink)}
.course-opt .co-txt small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.course-opt .co-chk{width:26px;height:26px;border-radius:50%;border:2px solid #CDE6D3;display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0;background:#fff}
.course-opt.on .co-chk{background:var(--green);border-color:var(--green);color:#FFE14D}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}



/* —— Responsive scale (t183u) ——
   Base (~390 / regular iPhone): restore pre-densify comfortable spacing
   Mid ≥393 (Pro): mild breathe
   Large ≥430 (Pro Max): noticeably larger type + padding (+2–4px / roomy)
*/
:root{
  --fs-body:16px;
  --fs-title:22px;
  --fs-hio:22px;
  --fs-name:18px;
  --fs-desc:15px;
  --fs-eyebrow:13px;
  --fs-soft:15px;
  --fs-nav:15px;
  --fs-cta:18px;
  --fs-tot:28px;
  --fs-amt:26px;
  --fs-ace:24px;
  --pad-main-y:10px;
  --pad-main-b:calc(248px + env(safe-area-inset-bottom,0px));
  --gap-main:8px;
  --top-h:58px;
  --course-h:52px;
  --card-pad:10px 12px 10px 14px;
  --tile:36px;
  --chk:28px;
  --cta-h:54px;
  --nav-h:46px;
  --dock-pad-y:12px;
  --step-btn-h:48px;
  --step-btn-w:44px;
  --r:14px;
}
body{font-size:var(--fs-body);min-height:100dvh;min-height:100vh}
.app{min-height:100dvh;min-height:100vh}
.top-row{height:var(--top-h);padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-row img{height:26px}
.menu{width:44px;height:44px;border-radius:var(--r)}
.menu svg{width:22px;height:22px}
main{gap:var(--gap-main);padding:var(--pad-main-y) max(12px,env(safe-area-inset-right,0px)) var(--pad-main-b) max(12px,env(safe-area-inset-left,0px))}
.course{gap:10px;min-height:var(--course-h);padding:6px;border-radius:var(--r)}
.badge{width:38px;height:38px;border-radius:var(--r)}
.eyebrow{font-size:var(--fs-eyebrow);letter-spacing:.04em}
.course .line{font-size:16px}
.soft{height:40px;padding:0 12px;font-size:var(--fs-soft);border-radius:var(--r);flex-shrink:0}
.intro{gap:2px;padding:4px 2px 2px}
.intro .row{gap:8px}
.intro h1{font-size:var(--fs-title);line-height:1.2}
.intro p{font-size:var(--fs-desc);line-height:1.35}
.steps{font-size:13px;gap:6px}
.steps i{width:16px;height:4px}
.card{gap:2px;padding:var(--card-pad);border-radius:var(--r);box-shadow:0 2px 12px rgba(16,32,23,.05)}
.card.on{padding-left:16px}
.head{min-height:36px;gap:8px}
.name{gap:10px}
.name b{font-size:var(--fs-name)}
.name small{font-size:15px}
.tile{width:var(--tile);height:var(--tile);border-radius:var(--r)}
.chk{width:var(--chk);height:var(--chk)}
.hio-title{font-size:var(--fs-hio)}
.desc{font-size:var(--fs-desc);line-height:1.35}
.hio-open{gap:6px;margin-top:8px}
.pair{gap:8px}
.stepper{padding:4px;border-radius:var(--r)}
.stepper button{width:var(--step-btn-w);height:var(--step-btn-h);font-size:24px;border-radius:var(--r)}
.amt small,.ace small{font-size:13px}
.amt b,.ace b{font-size:var(--fs-amt)}
.ace{padding:6px 8px;border-radius:var(--r)}
.ace b{font-size:var(--fs-ace)}
.slide{gap:8px;font-size:14px}
.slide input{height:36px}
.bottom-in{border-radius:16px 16px 0 0}
.dock{gap:12px;padding:var(--dock-pad-y) max(12px,env(safe-area-inset-right,0px)) var(--dock-pad-y) max(16px,env(safe-area-inset-left,0px))}
.sum{min-width:0}
.sum small{font-size:14px}
.sum .tot{gap:8px}
.sum .tot b{font-size:var(--fs-tot)}
.chips span{width:24px;height:24px;font-size:10px}
.cta{height:var(--cta-h);padding:0 20px;font-size:var(--fs-cta);border-radius:var(--r);max-width:none;white-space:nowrap}
.cta:disabled{padding:0 18px;font-size:16px}
.cta svg{flex-shrink:0;width:20px;height:20px}
.toast{top:calc(58px + env(safe-area-inset-top,0px));padding:10px 14px;font-size:14px}
nav{gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav a{gap:6px;height:var(--nav-h);font-size:var(--fs-nav);border-radius:var(--r);padding:0 6px}
nav a svg{width:20px;height:20px;flex-shrink:0}
.sheet{padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0}
.sheet h2{font-size:20px}
.sheet-close{width:40px;height:40px;font-size:22px}

/* Pro (~393) — mild breathe above base */
@media (min-width:393px){
  :root{
    --fs-title:clamp(22px,5.2vw,24px);
    --fs-hio:clamp(22px,5.4vw,24px);
    --fs-name:19px;
    --fs-tot:clamp(28px,6vw,30px);
    --pad-main-y:12px;
    --gap-main:10px;
    --top-h:60px;
    --card-pad:12px 14px 12px 16px;
    --cta-h:56px;
    --nav-h:48px;
    --fs-cta:19px;
    --fs-nav:15px;
  }
  .course .line{font-size:16px}
  .name small{font-size:15px}
}

/* Pro Max (≥430) — noticeably larger type + spacing */
@media (min-width:430px){
  :root{
    --fs-body:18px;
    --fs-title:clamp(24px,5.2vw,26px);
    --fs-hio:clamp(24px,5.4vw,26px);
    --fs-name:20px;
    --fs-desc:17px;
    --fs-eyebrow:14px;
    --fs-soft:16px;
    --fs-nav:16px;
    --fs-cta:20px;
    --fs-tot:clamp(30px,6.2vw,34px);
    --fs-amt:28px;
    --fs-ace:28px;
    --pad-main-y:14px;
    --pad-main-b:calc(280px + env(safe-area-inset-bottom,0px));
    --gap-main:12px;
    --top-h:64px;
    --course-h:58px;
    --card-pad:14px 16px 14px 18px;
    --tile:42px;
    --chk:32px;
    --cta-h:58px;
    --nav-h:52px;
    --dock-pad-y:14px;
    --step-btn-h:52px;
    --step-btn-w:48px;
    --r:16px;
  }
  .top-row img{height:30px}
  .menu{width:48px;height:48px}
  .menu svg{width:24px;height:24px}
  .badge{width:42px;height:42px}
  .course .line{font-size:17px}
  .soft{height:44px;padding:0 14px;font-size:16px}
  .name small{font-size:16px}
  .amt small,.ace small{font-size:14px}
  .slide{font-size:15px}
  .slide input{height:40px}
  .sum small{font-size:15px}
  .intro p{font-size:17px}
  .steps{font-size:14px}
  .stepper button{font-size:26px}
  .chips span{width:28px;height:28px;font-size:11px}
  .cta{padding:0 22px}
  .cta:disabled{padding:0 18px;font-size:17px}
  .cta svg{width:22px;height:22px}
  nav a{gap:8px;padding:0 8px}
  nav a svg{width:22px;height:22px}
  .card{box-shadow:0 3px 14px rgba(16,32,23,.06)}
  .toast{top:calc(64px + env(safe-area-inset-top,0px));padding:12px 16px;font-size:15px}
  .sheet h2{font-size:22px}
  .sheet-close{width:44px;height:44px}
}

</style>
</head>

<body class="hdr-clean">
<div class="app">
  <header class="top">
    <div class="top-row">
      <img src="logo.png" alt="TeeShot.ai">
      <button class="menu" type="button" aria-label="Open menu" data-toast="Menu opens here in the full app.">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="course" id="playing-at" aria-label="Playing at">
      <span class="badge" aria-hidden="true"><svg width="16" height="26" viewBox="0 0 16 26" fill="none"><path d="M2 2v22" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M3 3l10 4-10 4z" fill="#FFE14D"/></svg></span>
      <span class="txt">
        <span class="eyebrow">PLAYING AT · <span id="meta">HOLE 7 · PAR 3</span></span>
        <span class="line"><b id="course">Glen Eagle Golf Club</b></span>
      </span>
      <button class="soft" type="button" id="change">Change</button>
    </section>

    <div class="intro">
      <div class="row">
        <h1>Select your games</h1>
        <span class="steps"><i class="on"></i><i></i>Step 1 of 2</span>
      </div>
      <p>One swing counts for every game you select.</p>
    </div>

    <section class="card hio" id="hio">
      <button class="hio-head" type="button" id="hio-btn" aria-pressed="false">
        <span class="head">
          <span class="name">
            <span class="tile" aria-hidden="true"><svg width="14" height="22" viewBox="0 0 14 22" fill="none"><path d="M2 2v18" stroke="#102017" stroke-width="2" stroke-linecap="round"/><path d="M3 3l9 3.5-9 3.5z" fill="#E0B400"/></svg></span>
            <span class="hio-title">HOLE IN ONE</span>
          </span>
          <span class="chk"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
        </span>
        <span class="desc">From $10 · an ace pays <b>400×</b> · up to $1M</span>
      </button>
      <div class="hio-open" id="hio-open" hidden>
        <div class="pair">
          <div class="stepper">
            <button type="button" id="dec" aria-label="Lower entry">−</button>
            <span class="amt"><small>Entry</small><b id="entry">$100</b></span>
            <button type="button" id="inc" aria-label="Raise entry">+</button>
          </div>
          <div class="ace" aria-live="polite">
            <small><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFE14D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/></svg>Ace wins</small>
            <b id="ace">$40,000</b>
          </div>
        </div>
        <label class="slide"><span>$10</span><input type="range" id="slider" min="0" max="7" step="1" value="3" aria-label="Entry amount"><span>$2,500</span></label>
      </div>
    </section>

    <button class="card" type="button" data-key="ctp" id="ctp" aria-pressed="false">
      <span class="head">
        <span class="name"><span class="tile" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></span><b>Closest to Pin</b><small>$10</small></span>
        <span class="chk"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
      </span>
      <span class="desc">Closest ball to the pin wins the daily pool.</span>
    </button>

    <button class="card" type="button" data-key="putt" id="putt" aria-pressed="false">
      <span class="head">
        <span class="name"><span class="tile" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="17" r="2.4" fill="currentColor" stroke="none"/><path d="M8 15.5c3-2 6-3.5 9-4" stroke-dasharray="2 3"/><ellipse cx="19.5" cy="11" rx="2.6" ry="1.7"/></svg></span><b>Longest Putt</b><small>$10</small></span>
        <span class="chk"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
      </span>
      <span class="desc">Longest putt wins the daily pool.</span>
    </button>

    <button class="card" type="button" data-key="ai" id="ai" aria-pressed="false">
      <span class="head">
        <span class="name"><span class="tile" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg></span><b>AI Coaching</b><small>+$2</small></span>
        <span class="chk"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
      </span>
      <span class="desc">Swing score, tips &amp; 3 drills for this swing.</span>
    </button>
  </main>

  <div class="bottom">
    <div class="bottom-in">
      <div class="dock" id="total-bar">
        <span class="sum">
          <small id="summary">No games selected</small>
          <span class="tot"><b id="total">$0</b><span class="chips" id="chips"></span></span>
        </span>
        <button class="cta" type="button" id="cta" disabled><span id="cta-label">Select a game first</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <nav aria-label="App">
        <a href="Play.html" class="cur" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l12 7-12 7V5z"/></svg>Play</a>
        <a href="Swings.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M21 8l-5 4 5 4V8z"/></svg>Swings</a>
        <a href="Leaderboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 6h3a3 3 0 0 1-3 3M7 6H4a3 3 0 0 0 3 3"/></svg>Leaderboard</a>
      </nav>
    </div>
  </div>
  <div class="sheet-backdrop" id="course-backdrop" hidden></div>
  <div class="sheet" id="course-sheet" role="dialog" aria-modal="true" aria-labelledby="course-sheet-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="course-sheet-title">Choose a course</h2>
      <button type="button" class="sheet-close" id="course-close">Close</button>
    </div>
    <div class="sheet-list" id="course-list" role="listbox" aria-labelledby="course-sheet-title"></div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function () {
  var steps = [10, 25, 50, 100, 250, 500, 1000, 2500];
  var courses = [
    { n: 'Glen Eagle Golf Club', m: 'HOLE 7 · PAR 3' },
    { n: 'Copper Creek Golf Club', m: 'HOLE 3 · PAR 3' },
    { n: 'Royal Oak GC', m: 'HOLE 12 · PAR 3' },
    { n: 'Lakeside Links', m: 'HOLE 5 · PAR 3' }
  ];
  var s = { i: 3, hio: false, ctp: false, putt: false, ai: false, c: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return '$' + n.toLocaleString('en-US'); };
  var t;
  function toast(msg) { var el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(t); t = setTimeout(function () { el.hidden = true; }, 2400); }

  function setCard(el, on) {
    el.classList.toggle('on', on);
    var btn = el.matches('button') ? el : el.querySelector('.hio-head');
    if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function render() {
    var entry = steps[s.i];
    $('entry').textContent = fmt(entry);
    $('ace').textContent = fmt(Math.min(entry * 400, 1000000));
    $('slider').value = s.i;
    $('dec').disabled = s.i === 0;
    $('inc').disabled = s.i === steps.length - 1;
    setCard($('hio'), s.hio);
    $('hio-open').hidden = !s.hio;
    document.querySelectorAll('[data-key]').forEach(function (el) { setCard(el, !!s[el.dataset.key]); });

    var count = (s.hio ? 1 : 0) + (s.ctp ? 1 : 0) + (s.putt ? 1 : 0);
    var total = (s.hio ? entry : 0) + (s.ctp ? 10 : 0) + (s.putt ? 10 : 0) + (s.ai && count ? 2 : 0);
    $('summary').textContent = count === 0 ? 'No games selected' : count + (count === 1 ? ' game' : ' games') + (s.ai ? ' + AI Coaching' : '') + ' · total';
    $('total').textContent = fmt(total);

    var codes = [];
    if (s.hio) codes.push(['H1', 'Hole in One']);
    if (s.ctp) codes.push(['CP', 'Closest to Pin']);
    if (s.putt) codes.push(['LP', 'Longest Putt']);
    if (s.ai && count) codes.push(['AI', 'AI Coaching']);
    var chips = $('chips');
    var have = Array.prototype.map.call(chips.children, function (c) { return c.textContent; }).join();
    if (have !== codes.map(function (c) { return c[0]; }).join()) {
      chips.innerHTML = '';
      codes.forEach(function (c) { var sp = document.createElement('span'); sp.textContent = c[0]; sp.title = c[1]; chips.appendChild(sp); });
    }

    var cta = $('cta');
    cta.disabled = count === 0;
    $('cta-label').textContent = count === 0 ? 'Select a game first' : 'Enter Contest';
  }

  window.__setHio = function (on) { s.hio = !!on; render(); };
  window.__setGames = function (opts) {
    if (!opts) return;
    if ('hio' in opts) s.hio = !!opts.hio;
    if ('ctp' in opts) s.ctp = !!opts.ctp;
    if ('putt' in opts) s.putt = !!opts.putt;
    if ('ai' in opts) s.ai = !!opts.ai;
    if ('i' in opts) s.i = opts.i;
    render();
  };

  $('hio-btn').addEventListener('click', function () { s.hio = !s.hio; render(); });
  document.querySelectorAll('[data-key]').forEach(function (el) {
    el.addEventListener('click', function () { s[el.dataset.key] = !s[el.dataset.key]; render(); });
  });
  $('dec').addEventListener('click', function (e) { e.stopPropagation(); if (s.i > 0) { s.i--; render(); } });
  $('inc').addEventListener('click', function (e) { e.stopPropagation(); if (s.i < steps.length - 1) { s.i++; render(); } });
  $('slider').addEventListener('input', function (e) { e.stopPropagation(); s.i = parseInt(e.target.value, 10) || 0; render(); });
  $('slider').addEventListener('click', function (e) { e.stopPropagation(); });
  function renderCourseList() {
    var list = $('course-list');
    list.innerHTML = '';
    courses.forEach(function (c, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'course-opt' + (i === s.c ? ' on' : '');
      btn.setAttribute('role', 'option');
      btn.setAttribute('aria-selected', i === s.c ? 'true' : 'false');
      btn.innerHTML = '<span class="co-txt"><b></b><small></small></span><span class="co-chk" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>';
      btn.querySelector('b').textContent = c.n;
      btn.querySelector('small').textContent = c.m;
      btn.addEventListener('click', function () {
        s.c = i;
        $('course').textContent = c.n;
        $('meta').textContent = c.m;
        closeCourseSheet();
        toast('Now playing at ' + c.n);
      });
      list.appendChild(btn);
    });
  }
  function openCourseSheet() {
    renderCourseList();
    $('course-backdrop').hidden = false;
    $('course-sheet').hidden = false;
    document.body.style.overflow = 'hidden';
    $('course-close').focus();
  }
  function closeCourseSheet() {
    $('course-backdrop').hidden = true;
    $('course-sheet').hidden = true;
    document.body.style.overflow = '';
  }
  window.__openSheet = openCourseSheet;
  window.__closeSheet = closeCourseSheet;
  $('change').addEventListener('click', function () { openCourseSheet(); });
  $('course-close').addEventListener('click', closeCourseSheet);
  $('course-backdrop').addEventListener('click', closeCourseSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('course-sheet').hidden) closeCourseSheet();
  });
  $('cta').addEventListener('click', function () { toast('Checkout opens here in the full app.'); });
  document.querySelectorAll('[data-toast]').forEach(function (el) {
    el.addEventListener('click', function (e) { e.preventDefault(); toast(el.dataset.toast); });
  });
  document.querySelectorAll('nav a.off').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();});});
  document.querySelectorAll('nav a.cur').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }); });
  render();
})();
</script>

</body>
</html>
